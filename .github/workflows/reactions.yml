name: Record reactions
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: reaction-writer
  cancel-in-progress: false
jobs:
  record:
    if: github.event_name != 'issues' || github.event.issue.title == '[reaction:v1]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Drain pending reaction issues
        run: node scripts/process-reactions.mjs
        env:
          GH_TOKEN: ${{ github.token }}
